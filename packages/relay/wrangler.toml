# Deploy: npx wrangler@3 deploy   (from packages/relay)
# Then:   npx wrangler@3 secret put AO_RELAY_TOKEN
name = "agent-office-relay"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "RELAY"
class_name = "RelayRoom"

[[migrations]]
tag = "v1"
new_classes = ["RelayRoom"]
